name: pm-fetch

on:
  schedule:
    - cron: "*/20 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pm-fetch
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: install deps
        run: pip install requests

      - name: fetch polymarket
        env:
          DUMP_RAW: "1"
        run: python fetch_polymarket.py

      - name: commit data
        run: |
          git config user.name "pm-bot"
          git config user.email "pm-bot@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "no change"
            exit 0
          fi
          git commit -m "data: $(date -u +%Y-%m-%dT%H:%MZ)"
          git push
